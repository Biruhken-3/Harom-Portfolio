name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: heron-port/package-lock.json

      - name: Install dependencies
        working-directory: heron-port
        run: npm ci

      - name: Lint
        working-directory: heron-port
        run: npm run lint

      - name: Build
        working-directory: heron-port
        run: npm run build

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to hosting
        # Configure your deployment target (Vercel, GH Pages, VPS, ...).
        # Example for Vercel:
        #   uses: amondnet/vercel-action@v25
        #   with:
        #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
        #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        #     working-directory: heron-port
        run: echo "Add your deployment step here (Vercel / GitHub Pages / VPS)."
